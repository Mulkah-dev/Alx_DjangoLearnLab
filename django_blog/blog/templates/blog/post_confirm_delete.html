{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Delete Post</h2>
    <p>Are you sure you want to delete the post <strong>"{{ object.title }}"</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'post-detail' object.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
<div class="form-group">
    {{ form.new_tags.label_tag }}
    {{ form.new_tags }}
    <small class="form-text text-muted">{{ form.new_tags.help_text }}</small>
</div>

{% endblock %}
