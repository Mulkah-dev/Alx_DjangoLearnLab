{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>{{ object.title }}</h2>
    <p class="text-muted">By {{ object.author }} on {{ object.date_posted|date:"M d, Y" }}</p>
    <hr>
    <p>{{ object.content }}</p>
    
    {% if user == object.author %}
        <a href="{% url 'post-update' object.id %}" class="btn btn-warning btn-sm">Edit</a>
        <a href="{% url 'post-delete' object.id %}" class="btn btn-danger btn-sm">Delete</a>
    {% endif %}
    
    <a href="{% url 'post-list' %}" class="btn btn-secondary btn-sm">Back to All Posts</a>
</div>
{% endblock %}
